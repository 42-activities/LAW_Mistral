name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    uses: ./.github/workflows/docker-deploy.yml
    with:
      images: '[{"name": "app", "context": "."}, {"name": "web", "context": "web"}]'
      deploy-path: ~/projects/LAW_Mistral
      health-url: http://127.0.0.1:8600/health/ready
    secrets: inherit
